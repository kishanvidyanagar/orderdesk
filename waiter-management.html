<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waiter Management - OrderDesk</title>
  <link rel="stylesheet" href="css/stylesheet.css" />
</head>

<body>

  <div class="app-container">

    <header class="app-header">

      <div class="brand">
        <h1>OrderDesk</h1>
        <p id="hotelGreeting">Waiter Management</p>
      </div>

      <button class="hamburger" id="hamburger">☰</button>

      <div class="nav-actions" id="navMenu">

        <a href="dashboard.html" class="button secondary">
          Dashboard
        </a>

        <a id="menuNav" href="menu.html" class="button secondary">
          Menu
        </a>

        <a href="orders.html" class="button secondary">
          Orders
        </a>

        <a id="kitchenNav" href="kitchen.html" class="button secondary">
          Kitchen
        </a>

        <a id="salesNav" href="sales.html" class="button secondary">
          Sales
        </a>

        <a id="waitersNav" href="waiter-management.html" class="button secondary">
          Waiters
        </a>

        <a id="historyNav" href="history.html" class="button secondary">
          History
        </a>

        <a id="settingsNav" href="settings.html" class="button secondary">
          Settings
        </a>

        <button id="logoutBtn" class="button secondary">
          Logout
        </button>

      </div>

    </header>

    <main>

      <div class="page-header">
        <h2 id="pageTitle">Manage Waiters</h2>
        <p id="pageDescription">Add, edit, and manage waiter accounts for your hotel</p>
      </div>

      <!-- ADD WAITER FORM -->
      <section class="card">

        <div class="page-header">
          <h3>Add New Waiter</h3>
        </div>

        <form id="addWaiterForm">

          <div class="field-row">
            <div class="field-group">
              <label>Waiter Name</label>
              <input id="waiterName" type="text" placeholder="Enter waiter name" required />
            </div>
            <div class="field-group">
              <label>Login ID</label>
              <input id="waiterLoginId" type="text" placeholder="Unique login ID" required />
            </div>
          </div>

          <div class="field-group">
            <label>Password</label>
            <input id="waiterPassword" type="password" placeholder="Enter password" required />
          </div>

          <button class="button primary" type="submit">
            Add Waiter
          </button>

        </form>

      </section>

      <!-- WAITERS LIST -->
      <section class="card">

        <div class="page-header">
          <h3>Waiters List</h3>
        </div>

        <div id="waiterList" class="menu-list"></div>

      </section>

      <!-- COOKS SECTION -->
      <section id="cookSection" class="card" style="display:none;">

        <div class="page-header">
          <h3 id="cookSectionTitle">Add New Cook</h3>
        </div>

        <form id="addCookForm">

          <div class="field-row">
            <div class="field-group">
              <label>Cook Name</label>
              <input id="cookName" type="text" placeholder="Enter cook name" required />
            </div>
            <div class="field-group">
              <label>Login ID</label>
              <input id="cookLoginId" type="text" placeholder="Unique login ID" required />
            </div>
          </div>

          <div class="field-group">
            <label>Password</label>
            <input id="cookPassword" type="password" placeholder="Enter password" required />
          </div>

          <button class="button primary" type="submit">
            Add Cook
          </button>

        </form>

      </section>

      <section id="cookListSection" class="card" style="display:none;">

        <div class="page-header">
          <h3>Cooks List</h3>
        </div>

        <div id="cookList" class="menu-list"></div>

      </section>

    </main>

  </div>

  <div id="messageBox" class="message hidden"></div>

  <script type="module" src="js/waiter-management.js"></script>
  <script type="module" src="js/common.js"></script>

</body>

</html>
