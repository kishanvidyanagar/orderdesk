<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login</title>

  <link rel="stylesheet" href="css/stylesheet.css" />
</head>

<body>

  <div class="app-container">

    <header class="app-header">
      <div class="brand">
        <h1>Admin Panel</h1>
        <p>OrderDesk Control System</p>
      </div>
    </header>

    <main>

      <div class="card auth-card">

        <div class="page-header">
          <h2>Admin Panel</h2>
          <p>OrderDesk Control System</p>
        </div>

        <div class="field-group">
          <label>Login ID</label>
          <input id="adminLoginId" type="text" placeholder="Enter admin login ID" required>
        </div>

        <div class="field-group">
          <label>Password</label>
          <input id="adminPassword" type="password" placeholder="Enter password" required>
        </div>

        <button class="button primary" id="adminLoginBtn">
          Login
        </button>

      </div>

    </main>

  </div>

  <div id="messageBox" class="message hidden"></div>

  <script type="module" src="js/admin-login.js"></script>

</body>

</html>
