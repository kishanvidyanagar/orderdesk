<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Dashboard - OrderDesk</title>

  <!-- YOUR THEME -->
  <link rel="stylesheet" href="css/stylesheet.css" />
</head>

<body>

  <div class="app-container">

    <!-- HEADER -->
    <header class="app-header">

      <div class="brand">
        <h1>Admin Dashboard</h1>
        <p>Manage hotels & features</p>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="button secondary" id="changeAdminPasswordBtn">
          Change Password
        </button>
        <button class="button secondary" id="logoutAdmin">
          Logout
        </button>
      </div>

    </header>


    <!-- HOTELS SECTION -->
    <section class="card">

      <div class="page-header">
        <h2>Hotels</h2>
        <p>Create and manage hotels</p>
      </div>

      <form id="hotelForm">

        <div class="field-group">
          <label>Hotel Name</label>
          <input id="hotelName" type="text" placeholder="Enter hotel name" required />
        </div>

        <button class="button primary" type="submit">
          Add Hotel
        </button>

      </form>

      <div id="hotelList" class="menu-list"></div>

    </section>

    <!-- OWNERS SECTION -->
    <section class="card">

      <div class="page-header">
        <h2>Owners</h2>
        <p>Create and manage hotel owners</p>
      </div>

      <form id="ownerForm">

        <div class="field-row">
          <div class="field-group">
            <label>Hotel</label>
            <select id="ownerHotel" class="hotelSelect" required></select>
          </div>
          <div class="field-group">
            <label>Owner Name</label>
            <input id="ownerName" type="text" placeholder="Enter owner name" required />
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Phone</label>
            <input id="ownerPhone" type="text" placeholder="Enter phone number" required />
          </div>
          <div class="field-group">
            <label>Login ID</label>
            <input id="ownerLoginId" type="text" placeholder="Enter unique login ID" required />
          </div>
        </div>

        <div class="field-group">
          <label>Password</label>
          <input id="ownerPassword" type="password" placeholder="Enter password" required />
        </div>

        <button class="button primary" type="submit">
          Create Owner Account
        </button>

      </form>

      <div id="ownerList" class="menu-list"></div>

    </section>

  </div>


  <!-- TOAST MESSAGE -->
  <div id="messageBox" class="message hidden"></div>


  <!-- SCRIPT -->
  <script type="module" src="js/admin-dashboard.js"></script>

</body>

</html>
